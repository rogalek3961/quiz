<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Quiz UE</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f7fa;
margin:0;
padding:20px;
color:#222;
}

.container{
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:20px;
}

h1,h2,h3{
margin-top:0;
}

.menu-btn,
.answer-btn,
.next-btn{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.menu-btn{
background:#0057b8;
color:white;
}

.answer-btn{
background:white;
border:1px solid #ddd;
}

.answer-btn:hover{
background:#f3f7ff;
}

.correct{
background:#d4edda!important;
border:1px solid #28a745!important;
}

.wrong{
background:#f8d7da!important;
border:1px solid #dc3545!important;
}

.next-btn{
background:#28a745;
color:white;
}

.timer{
font-size:22px;
font-weight:bold;
color:#dc3545;
}

.progress{
height:15px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin:15px 0;
}

.progress-bar{
height:100%;
background:#0057b8;
width:0%;
}

.search{
width:100%;
padding:12px;
font-size:16px;
margin-bottom:20px;
}

.question-card{
border:1px solid #ddd;
padding:15px;
margin-bottom:15px;
border-radius:8px;
background:white;
}

.bad-question{
border-left:5px solid #dc3545;
padding-left:10px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

<div id="app"></div>

</div>

<script src="questions.js"></script>

<script>

let examQuestions=[];
let currentIndex=0;
let score=0;
let timeLeft=1800;
let timer=null;
let wrongQuestions=[];

showMenu();

function showMenu(){

clearInterval(timer);

document.getElementById("app").innerHTML=`

<div class="card">

<h1>Quiz UE</h1>

<button class="menu-btn" onclick="startExam()">
Egzamin
</button>

<button class="menu-btn" onclick="showKnowledgeBase()">
Baza Wiedzy
</button>

</div>
`;

}

function shuffle(arr){
return [...arr].sort(()=>Math.random()-0.5);
}

function startExam(){

examQuestions=shuffle(questions).slice(0,50);

currentIndex=0;
score=0;
wrongQuestions=[];
timeLeft=1800;

startTimer();

showQuestion();

}

function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

timeLeft--;

if(timeLeft<=0){

clearInterval(timer);
finishExam();

}

const timerElement=document.getElementById("timer");

if(timerElement){

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

timerElement.innerText=
`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

}

},1000);

}

function showQuestion(){

let q=examQuestions[currentIndex];

let shuffledAnswers=
shuffle(
q.answers.map((answer,index)=>({
answer,
index
}))
);

let progress=
((currentIndex)/50)*100;

let html=`

<div class="card">

<div class="timer">
⏳ <span id="timer"></span>
</div>

<h3>
Pytanie ${currentIndex+1} z 50
</h3>

<div class="progress">
<div class="progress-bar" style="width:${progress}%"></div>
</div>

<p>
${q.question}
</p>

`;

shuffledAnswers.forEach(item=>{

html+=`

<button
class="answer-btn"
onclick="checkAnswer(${item.index},this)">
${item.answer}
</button>

`;

});

html+=`
<div id="result"></div>
</div>
`;

document.getElementById("app").innerHTML=html;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").innerText=
`${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

}

function checkAnswer(selected,button){

let q=examQuestions[currentIndex];

document
.querySelectorAll(".answer-btn")
.forEach(btn=>btn.disabled=true);

let correctText=q.answers[q.correct];

let explanation=
q.explanation && q.explanation.trim()!=""
? q.explanation
: "Brak uzasadnienia w bazie pytań.";

if(selected===q.correct){

button.classList.add("correct");
score++;

}else{

button.classList.add("wrong");

wrongQuestions.push(q);

}

document.getElementById("result").innerHTML=`

<hr>

<h3>
${selected===q.correct
? "✅ Poprawna odpowiedź"
: "❌ Niepoprawna odpowiedź"}
</h3>

<p>
<strong>Prawidłowa odpowiedź:</strong><br>
${correctText}
</p>

<p>
<strong>Uzasadnienie:</strong><br>
${explanation}
</p>

<button class="next-btn" onclick="nextQuestion()">
Następne pytanie
</button>

`;

}

function nextQuestion(){

currentIndex++;

if(currentIndex>=50){

finishExam();

}else{

showQuestion();

}

}

function finishExam(){

clearInterval(timer);

let percent=
Math.round(score/50*100);

let html=`

<div class="card">

<h2>Koniec egzaminu</h2>

<h1>${score}/50</h1>

<h2>${percent}%</h2>

<p>
Poprawne: ${score}
</p>

<p>
Błędne: ${50-score}
</p>

`;

if(wrongQuestions.length){

html+=`
<h3>
Pytania wymagające powtórki
</h3>
`;

wrongQuestions.forEach(q=>{

html+=`

<div class="bad-question">

<strong>
${q.question}
</strong>

<br><br>

✅ ${q.answers[q.correct]}

</div>

`;

});

}

html+=`

<button class="menu-btn"
onclick="showMenu()">
Powrót do menu
</button>

</div>

`;

document.getElementById("app").innerHTML=html;

}

function showKnowledgeBase(){

let html=`

<div class="card">

<h2>Baza Wiedzy</h2>

<input
type="text"
class="search"
id="search"
placeholder="Szukaj pytania..."
onkeyup="filterQuestions()">

<div id="knowledgeList">

`;

questions.forEach((q,index)=>{

html+=`

<div class="question-card">

<h3>
${index+1}. ${q.question}
</h3>

<p>A. ${q.answers[0]}</p>
<p>B. ${q.answers[1]}</p>
<p>C. ${q.answers[2]}</p>
<p>D. ${q.answers[3]}</p>

<p>
<strong>Poprawna odpowiedź:</strong>
${q.answers[q.correct]}
</p>

<p>
<strong>Uzasadnienie:</strong><br>
${q.explanation || "Brak uzasadnienia"}
</p>

</div>

`;

});

html+=`

</div>

<button class="menu-btn"
onclick="showMenu()">
Powrót
</button>

</div>

`;

document.getElementById("app").innerHTML=html;

}

function filterQuestions(){

let phrase=
document
.getElementById("search")
.value
.toLowerCase();

let cards=
document.querySelectorAll(".question-card");

cards.forEach(card=>{

card.style.display=
card.innerText.toLowerCase().includes(phrase)
? "block"
: "none";

});

}

</script>

</body>
</html>
