
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Egzaminacyjny</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:20px;background:#f4f4f4}
.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.answer{display:block;width:100%;margin:10px 0;padding:12px;border:none;border-radius:8px;cursor:pointer}
.correct{background:#b7f5b7!important}
.wrong{background:#ffb3b3!important}
#timer{font-size:22px;font-weight:bold;margin-bottom:15px}
button{padding:12px 18px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div id="start">
<h2>Quiz</h2>
<p>Losowanych jest 50 pytań. Limit czasu: 30 minut.</p>
<button onclick="startQuiz()">Rozpocznij</button>
</div>

<div id="quiz" style="display:none">
<div id="timer">30:00</div>
<div id="counter"></div>
<h3 id="question"></h3>
<div id="answers"></div>
<button id="next" style="display:none">Następne pytanie</button>
</div>

<div id="results" style="display:none"></div>
</div>

<script src="questions.js"></script>
<script>
function shuffle(a){ return [...a].sort(()=>Math.random()-0.5); }

let selected=[], current=0, points=0, wrongAnswers=[];
let timeLeft=1800, timerInterval;

function startQuiz(){
selected=shuffle(questions).slice(0,Math.min(50,questions.length));
current=0; points=0; wrongAnswers=[];
timeLeft=1800;

document.getElementById('start').style.display='none';
document.getElementById('results').style.display='none';
document.getElementById('quiz').style.display='block';

clearInterval(timerInterval);
timerInterval=setInterval(updateTimer,1000);

loadQuestion();
}

function updateTimer(){
timeLeft--;
const m=Math.floor(timeLeft/60);
const s=timeLeft%60;
document.getElementById('timer').innerHTML=
`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

if(timeLeft<=0){
clearInterval(timerInterval);
finishQuiz();
}
}

function loadQuestion(){
document.getElementById('next').style.display='none';

if(current>=selected.length){
finishQuiz();
return;
}

const q=selected[current];
document.getElementById('counter').innerHTML=`Pytanie ${current+1}/${selected.length}`;
document.getElementById('question').innerHTML=q.question;

const answers=q.answers.map((a,i)=>({text:a,correct:i===q.correct}));
const shuffled=shuffle(answers);

const box=document.getElementById('answers');
box.innerHTML='';

shuffled.forEach(ans=>{
const btn=document.createElement('button');
btn.className='answer';
btn.textContent=ans.text;

btn.onclick=()=>{
document.querySelectorAll('.answer').forEach(x=>x.disabled=true);

if(ans.correct){
btn.classList.add('correct');
points++;
}else{
btn.classList.add('wrong');

wrongAnswers.push({
question:q.question,
correct:answers.find(x=>x.correct).text
});

document.querySelectorAll('.answer').forEach(x=>{
if(x.textContent===answers.find(y=>y.correct).text){
x.classList.add('correct');
}
});
}
document.getElementById('next').style.display='block';
};
box.appendChild(btn);
});
}

document.getElementById('next').onclick=()=>{
current++;
loadQuestion();
};

function finishQuiz(){
clearInterval(timerInterval);

document.getElementById('quiz').style.display='none';

const percent=((points/selected.length)*100).toFixed(1);

let grade="Wymaga nauki";
if(percent>=90) grade="Ekspert";
else if(percent>=75) grade="Zaawansowany";
else if(percent>=50) grade="Średniozaawansowany";

let html=`
<h2>Quiz zakończony</h2>
<h3>Wynik: ${points}/${selected.length} (${percent}%)</h3>
<h3>Poziom: ${grade}</h3>
<button onclick="downloadPDF()">Pobierz PDF z wynikami</button>
<br><br>
<button onclick="startQuiz()">Rozwiąż ponownie</button>
`;

if(wrongAnswers.length){
html += "<h3>Błędne pytania:</h3><ol>";
wrongAnswers.forEach(w=>{
html += `<li><b>${w.question}</b><br>Poprawna odpowiedź: ${w.correct}</li><br>`;
});
html += "</ol>";
}

const r=document.getElementById('results');
r.innerHTML=html;
r.style.display='block';
}

function downloadPDF(){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const percent=((points/selected.length)*100).toFixed(1);

let y=20;

doc.setFontSize(16);
doc.text("Wyniki quizu",10,y);
y+=10;

doc.setFontSize(12);
doc.text(`Wynik: ${points}/${selected.length} (${percent}%)`,10,y);
y+=10;

doc.text("Bledne pytania i poprawne odpowiedzi:",10,y);
y+=10;

wrongAnswers.forEach((w,i)=>{
const lines=doc.splitTextToSize(
`${i+1}. ${w.question} | Poprawna odpowiedz: ${w.correct}`,
180
);

if(y>260){
doc.addPage();
y=20;
}

doc.text(lines,10,y);
y+=lines.length*7;
});

doc.save("wynik_quizu.pdf");
}
</script>
</body>
</html>
