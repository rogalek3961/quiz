<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Egzamin UE</title>
<style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:auto;padding:20px;background:#f7f7f7}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
button{padding:12px 18px;margin:5px;cursor:pointer}
.answer{display:block;width:100%;text-align:left;margin:8px 0}
.timer{font-size:22px;font-weight:bold}
.correct{background:#d4edda}
.wrong{background:#f8d7da}
</style>
</head>
<body>
<div class="card">
<h1>Egzamin UE</h1>
<div id="app"></div>
</div>

<script src="questions.js"></script>
<script>
let examQuestions=[];
let current=0;
let score=0;
let timeLeft=1800;
let timerId=null;

function menu(){
document.getElementById("app").innerHTML=`
<h2>Wybierz tryb</h2>
<button onclick="startExam()">Egzamin</button>
<button onclick="knowledgeBase()">Baza wiedzy</button>`;
}

function startExam(){
examQuestions=[...questions].sort(()=>Math.random()-0.5).slice(0,50);
current=0;
score=0;
timeLeft=1800;
clearInterval(timerId);
timerId=setInterval(updateTimer,1000);
showQuestion();
}

function updateTimer(){
timeLeft--;
let m=Math.floor(timeLeft/60);
let s=timeLeft%60;
const el=document.getElementById("timer");
if(el) el.textContent=`${m}:${String(s).padStart(2,'0')}`;
if(timeLeft<=0){
clearInterval(timerId);
finishExam();
}
}

function showQuestion(){
const q=examQuestions[current];
let answers=q.answers.map((a,i)=>({a,i})).sort(()=>Math.random()-0.5);

let html=`
<div class="timer">⏳ <span id="timer"></span></div>
<h3>Pytanie ${current+1}/50</h3>
<p><b>${q.question}</b></p>`;

answers.forEach(x=>{
html+=`<button class="answer" onclick="answer(${x.i})">${x.a}</button>`;
});

html+=`<div id="feedback"></div>`;
document.getElementById("app").innerHTML=html;
updateTimer();
}

function answer(selected){
const q=examQuestions[current];
const correct=selected===q.correct;
if(correct) score++;

document.getElementById("feedback").innerHTML=`
<hr>
<p>${correct?'✅ Poprawna':'❌ Niepoprawna'}</p>
<p><b>Prawidłowa odpowiedź:</b><br>${q.answers[q.correct]}</p>
<p><b>Uzasadnienie:</b><br>${q.explanation||'Brak uzasadnienia'}</p>
<button onclick="nextQuestion()">Dalej</button>`;
}

function nextQuestion(){
current++;
if(current>=50){finishExam();}
else{showQuestion();}
}

function finishExam(){
clearInterval(timerId);
document.getElementById("app").innerHTML=`
<h2>Wynik końcowy</h2>
<p>${score}/50</p>
<button onclick="menu()">Powrót</button>`;
}

function knowledgeBase(){
let html='<h2>Baza wiedzy</h2><button onclick="menu()">Powrót</button>';
questions.forEach((q,n)=>{
html+=`<hr>
<h3>${n+1}. ${q.question}</h3>
<p><b>Odpowiedzi:</b></p>
<ul>${q.answers.map(a=>'<li>'+a+'</li>').join('')}</ul>
<p><b>Prawidłowa:</b> ${q.answers[q.correct]}</p>
<p><b>Uzasadnienie:</b><br>${q.explanation||'Brak uzasadnienia'}</p>`;
});
document.getElementById("app").innerHTML=html;
}

menu();
</script>
</body>
</html>
