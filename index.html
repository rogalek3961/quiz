<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button.answer{display:block;width:100%;margin:10px 0;padding:14px;border:none;border-radius:8px;cursor:pointer;font-size:16px}
.correct{background:#b8f5b8!important}
.wrong{background:#ffb3b3!important}
#next{margin-top:20px;padding:12px 20px}
</style>
</head>
<body>
<div class="card">
<h2 id="counter"></h2>
<h3 id="question"></h3>
<div id="answers"></div>
<button id="next" style="display:none;">Następne pytanie</button>
<h3 id="score"></h3>
</div>

<script src="questions.js"></script>
<script>
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

let qs = shuffle(questions);
let current=0, points=0;

function loadQuestion(){
document.getElementById('next').style.display='none';
if(current>=qs.length){
document.getElementById('question').innerHTML="Quiz zakończony!";
document.getElementById('answers').innerHTML="";
document.getElementById('counter').innerHTML="";
document.getElementById('score').innerHTML=
`Wynik: ${points}/${qs.length} (${((points/qs.length)*100).toFixed(1)}%)`;
return;
}
const q=qs[current];
document.getElementById('counter').innerHTML=`Pytanie ${current+1} z ${qs.length}`;
document.getElementById('question').innerHTML=q.question;

const answers=q.answers.map((a,i)=>({text:a,correct:i===q.correct}));
const shuffled=shuffle(answers);

const container=document.getElementById('answers');
container.innerHTML='';

shuffled.forEach(ans=>{
const btn=document.createElement('button');
btn.className='answer';
btn.textContent=ans.text;

btn.onclick=()=>{
document.querySelectorAll('.answer').forEach(b=>b.disabled=true);

if(ans.correct){
btn.classList.add('correct');
points++;
}else{
btn.classList.add('wrong');
[...document.querySelectorAll('.answer')].forEach(b=>{
if(b.textContent===answers.find(x=>x.correct).text){
b.classList.add('correct');
}
});
}
document.getElementById('next').style.display='block';
};
container.appendChild(btn);
});
}

document.getElementById('next').onclick=()=>{
current++;
loadQuestion();
};

loadQuestion();
</script>
</body>
</html>
